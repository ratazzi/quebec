name: Tests

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features

      - name: Check build
        run: cargo check --all-targets

  pytest:
    name: Pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mysql, sqlite]

    services:
      postgres:
        image: ${{ matrix.database == 'postgresql' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: quebec_test
          POSTGRES_PASSWORD: quebec_test
          POSTGRES_DB: quebec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quebec_test -d quebec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: quebec_test
          MYSQL_DATABASE: quebec_test
        ports:
          - 3306:3306
        # TCP rather than `mysqladmin ping`: the entrypoint's temporary init
        # server answers on the socket before the real server is listening.
        options: >-
          --health-cmd "mysql -h127.0.0.1 -uroot -pquebec_test -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-pytest-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Build extension
        run: uv run --with maturin maturin develop

      - name: Run pytest
        env:
          QUEBEC_SKIP_IMPORT_HOOK: "1"
          TEST_POSTGRESQL_URL: ${{ matrix.database == 'postgresql' && 'postgresql://quebec_test:quebec_test@127.0.0.1:5432/quebec_test' || '' }}
          # root: each test creates and drops its own database.
          TEST_MYSQL_URL: ${{ matrix.database == 'mysql' && 'mysql://root:quebec_test@127.0.0.1:3306/quebec_test' || '' }}
        run: uv run pytest --database=${{ matrix.database }} --ignore=tests/step_defs
